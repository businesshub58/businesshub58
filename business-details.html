
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover business information, services, and contact details on BusinessHub58.">
  <title>Business Details | BusinessHub58</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .business-details-page {
      width: min(100% - 32px, 1000px);
      margin: 40px auto;
    }

    .business-details-card {
      padding: 32px;
      border-radius: 16px;
      background: var(--card-bg, #ffffff);
      color: var(--text-color, #222222);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .business-details-category {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #e5f4ed;
      color: #176b48;
      font-size: 14px;
    }

    .business-details-description {
      line-height: 1.8;
      margin: 20px 0;
    }

    .business-contact-list {
      padding-left: 20px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .business-details-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .business-details-actions a,
    .business-back-link {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
    }

    .business-primary-link {
      background: #087f5b;
      color: #ffffff;
    }

    .business-back-link {
      margin-bottom: 20px;
      color: inherit;
    }

    .business-detail-message {
      padding: 20px;
      border-radius: 10px;
      background: #f4f6f5;
      color: #333333;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .business-details-card {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="business-details-page">
    <a class="business-back-link" href="businesses.html">
      &larr; Back to Businesses
    </a>

    <section id="business-details" class="business-details-card" aria-live="polite">
      <p>Loading business details...</p>
    </section>
  </main>

  <script src="business-details.js"></script>
</body>
</html>
